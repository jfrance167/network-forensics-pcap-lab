name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Rebuild capture
        run: python generate_synthetic_pcap.py reports/rebuilt.pcap
      - name: Verify deterministic evidence
        run: python -c "from pathlib import Path; assert Path('reports/rebuilt.pcap').read_bytes() == Path('samples/synthetic-incident.pcap').read_bytes()"
      - name: Run tests
        run: python -m unittest discover -s tests -v
